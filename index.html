<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Milk Tycoon Pro | Attractive Neon Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-blue: #00f2ff;
            --neon-pink: #ff00ff;
            --neon-gold: #ffcc00;
            --milk-white: #ffffff;
            --glass-rim: #a0f0f5;
            --bg-dark: #05050a;
            --glass-panel: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(at 10% 10%, rgba(0, 242, 255, 0.07) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(255, 0, 255, 0.07) 0px, transparent 50%);
            color: white;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Header Stats --- */
        .header {
            width: 100%;
            padding: 15px 20px;
            text-align: center;
            background: var(--glass-panel);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
            z-index: 100;
        }

        #milk-count {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.5rem, 10vw, 5rem);
            margin: 0;
            text-shadow: 0 0 20px var(--neon-blue), 0 0 40px var(--neon-blue);
            font-weight: 900;
        }

        .stats-sub {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 0.9rem;
            color: var(--neon-pink);
            font-weight: 600;
            margin-top: 5px;
            letter-spacing: 1px;
        }

        /* --- Rewarded Section --- */
        .reward-box {
            display: flex;
            justify-content: center;
            padding: 15px;
            z-index: 90;
        }

        .ad-btn {
            background: linear-gradient(45deg, #ffcc00, #ff6600);
            border: none;
            padding: 12px 28px;
            border-radius: 50px;
            font-weight: 700;
            color: black;
            cursor: pointer;
            box-shadow: 0 0 20px var(--neon-gold);
            transition: all 0.3s;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .ad-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 0 30px var(--neon-gold);
        }

        .ad-btn:disabled {
            background: #333;
            box-shadow: none;
            color: #777;
            cursor: not-allowed;
        }

        /* --- Game World & The ATTRACTIVE Glass --- */
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            width: 100%;
            padding: 20px;
        }

        .boost-msg {
            color: var(--neon-gold);
            font-weight: 700;
            height: 30px;
            text-shadow: 0 0 10px var(--neon-gold);
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 20px;
        }

        /* --- CUSTOM ATTRACTIVE NEON GLASS --- */
        .glass-container {
            width: clamp(150px, 40vw, 250px);
            height: clamp(250px, 60vw, 400px);
            position: relative;
            cursor: pointer;
            transition: transform 0.05s ease;
            z-index: 5;
        }

        /* The glass body */
        .glass-body {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 90%;
            background: rgba(255, 255, 255, 0.03);
            border: 4px solid var(--glass-rim);
            border-radius: 10px 10px 50px 50px; /* tapered bottom */
            box-shadow: 
                0 0 20px var(--glass-rim),
                inset 0 0 15px rgba(255,255,255,0.1);
            overflow: hidden;
        }

        /* The Milk Inside */
        .milk-fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 85%; /* Filled level */
            background-color: var(--milk-white);
            border-radius: 0 0 45px 45px;
            box-shadow: 0 0 30px rgba(255,255,255,0.8);
            transition: height 0.3s ease;
        }

        /* The Shine on Glass */
        .glass-shine {
            position: absolute;
            top: 10%;
            left: 15%;
            width: 10%;
            height: 60%;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
        }

        /* Click Animations */
        .glass-container.clicked {
            animation: shakeGlass 0.1s ease-in-out;
        }

        @keyframes shakeGlass {
            0% { transform: scale(0.95) rotate(0deg); }
            25% { transform: scale(0.95) rotate(-5deg); }
            75% { transform: scale(0.95) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        /* --- Shop (Responsive Side/Bottom) --- */
        .shop {
            display: flex;
            gap: 15px;
            padding: 20px;
            width: 100%;
            justify-content: center;
            background: var(--glass-panel);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .upgrade-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--neon-pink);
            padding: 15px;
            border-radius: 12px;
            min-width: 160px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }

        .upgrade-card:hover:not(.locked) {
            background: var(--neon-pink);
            color: black;
            box-shadow: 0 0 25px var(--neon-pink);
            transform: translateY(-2px);
        }

        .upgrade-card.locked {
            opacity: 0.2;
            cursor: not-allowed;
            filter: grayscale(1);
        }

        .u-name { display: block; font-weight: 700; font-size: 0.9rem; }
        .u-cost { font-weight: 600; color: #00ff00; }

        /* --- Animations --- */
        .plus-anim {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: clamp(2rem, 5vw, 3rem);
            color: white;
            pointer-events: none;
            animation: floatUp 0.7s ease-out forwards;
            z-index: 100;
            text-shadow: 0 0 10px white;
        }

        @keyframes floatUp {
            to { transform: translateY(-150px) scale(1.3); opacity: 0; }
        }

        /* --- Desktop Layout Change --- */
        @media (min-width: 1024px) {
            .game-area { flex-direction: row; padding: 0 100px; }
            .shop { 
                flex-direction: column; 
                width: 300px; 
                height: 100%; 
                border-top: none; 
                border-left: 1px solid rgba(255,255,255,0.1);
                justify-content: flex-start;
                padding-top: 100px;
            }
            .upgrade-card { width: 100%; text-align: left; }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1 id="milk-count">0</h1>
        <div class="stats-sub">
            <span>CLICK: +<span id="click-p">1</span> L</span>
            <span>AUTO: <span id="auto-p">0</span> L/S</span>
        </div>
    </header>

    <div class="reward-box">
        <button class="ad-btn" id="boost-btn" onclick="watchAd()">
            📺 WATCH AD (2X BOOST 10s)
        </button>
    </div>

    <main class="game-area">
        <div class="boost-msg" id="boost-status"></div>
        
        <div class="glass-container" id="milk-target">
            <div class="glass-body">
                <div class="milk-fill" id="milk-fill-level"></div>
                <div class="glass-shine"></div>
            </div>
        </div>
        
        <div class="shop">
            <div class="upgrade-card" id="upg-manual" onclick="buy('manual')">
                <span class="u-name">⚡ SUPER PRESS</span>
                <span class="u-cost">COST: <span id="cost-manual">20</span> L</span>
            </div>
            <div class="upgrade-card" id="upg-machine" onclick="buy('machine')">
                <span class="u-name">⚙️ AUTO MACHINE</span>
                <span class="u-cost">COST: <span id="cost-machine">150</span> L</span>
            </div>
        </div>
    </main>

    <script>
        let milk = 0;
        let pClick = 1;
        let pAuto = 0;
        let multiplier = 1;

        let costs = { manual: 20, machine: 150 };

        // --- Audio Context ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playSound(freq, type, vol, dur) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        }

        // --- Interaction ---
        const target = document.getElementById('milk-target');
        const fillLevel = document.getElementById('milk-fill-level');

        function handleAction(e) {
            initAudio();
            const amount = pClick * multiplier;
            milk += amount;
            
            // Heavy Industrial Hit Sound
            playSound(60, 'triangle', 0.5, 0.2); 
            playSound(120, 'sine', 0.3, 0.1); 

            // Visuals: Shake the glass
            target.classList.add('clicked');
            setTimeout(() => target.classList.remove('clicked'), 100);

            // Floating Text
            const x = e.clientX || (e.touches ? e.touches[0].clientX : window.innerWidth/2);
            const y = e.clientY || (e.touches ? e.touches[0].clientY : window.innerHeight/2);
            showPop(x, y, `+${amount}`);
            
            updateFillLevel();
            update();
        }

        target.addEventListener('mousedown', handleAction);
        target.addEventListener('touchstart', (e) => { e.preventDefault(); handleAction(e); });

        // Change milk fill level based on multipliers (Visual feedback)
        function updateFillLevel() {
            const level = multiplier > 1 ? 95 : 85; // Boosted means full
            fillLevel.style.height = level + '%';
        }

        // --- Rewarded System ---
        function watchAd() {
            const btn = document.getElementById('boost-btn');
            btn.disabled = true;
            btn.innerText = "🎬 PLAYING AD...";

            setTimeout(() => {
                multiplier = 2;
                // Power Up Sound
                playSound(200, 'sawtooth', 0.2, 0.5);
                playSound(400, 'sawtooth', 0.2, 0.4);
                
                document.getElementById('boost-status').innerText = "🔥 2X PRODUCTION ACTIVE! 🔥";
                btn.innerText = "COOLDOWN (30s)";
                
                updateFillLevel();
                update();

                // End boost after 10s
                setTimeout(() => {
                    multiplier = 1;
                    document.getElementById('boost-status').innerText = "";
                    updateFillLevel();
                    update();
                }, 10000);

                // Enable ad after 30s
                setTimeout(() => {
                    btn.disabled = false;
                    btn.innerText = "📺 WATCH AD (2X BOOST 10s)";
                }, 30000);

            }, 2000);
        }

        // --- Shop Logic ---
        function buy(id) {
            initAudio();
            if (milk >= costs[id]) {
                milk -= costs[id];
                // Upgrade Sound
                playSound(350, 'square', 0.2, 0.3);
                playSound(700, 'sine', 0.1, 0.2);
                
                if (id === 'manual') pClick += 2;
                else pAuto += 5;

                costs[id] = Math.round(costs[id] * 1.8);
                update();
            }
        }

        function showPop(x, y, text) {
            const div = document.createElement('div');
            div.className = 'plus-anim';
            div.style.left = (x - 20) + 'px';
            div.style.top = (y - 50) + 'px';
            div.innerText = text;
            if(multiplier > 1) div.style.color = 'var(--neon-gold)';
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 700);
        }

        function update() {
            document.getElementById('milk-count').innerText = Math.floor(milk).toLocaleString();
            document.getElementById('click-p').innerText = pClick * multiplier;
            document.getElementById('auto-p').innerText = pAuto * multiplier;
            document.getElementById('cost-manual').innerText = costs.manual;
            document.getElementById('cost-machine').innerText = costs.machine;

            document.getElementById('upg-manual').className = milk >= costs.manual ? 'upgrade-card' : 'upgrade-card locked';
            document.getElementById('upg-machine').className = milk >= costs.machine ? 'upgrade-card' : 'upgrade-card locked';
        }

        // Auto Generation Loop
        setInterval(() => {
            if (pAuto > 0) {
                milk += (pAuto * multiplier) / 10;
                update();
            }
        }, 100);

        update();
    </script>
</body>
</html>
